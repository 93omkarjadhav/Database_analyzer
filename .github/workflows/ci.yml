name: Node.js CI

# Trigger this workflow on every push or pull request to the main branch
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  frontend-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Pull your code fromGitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Step 3: Install frontend dependencies
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      # Step 4: Run frontend tests automatically
      - name: Run Frontend Tests
        env:
          CI: true
        run: |
          cd frontend
          npm test -- --watchAll=false

  backend-test:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: 5000
      MONGO_URI: mongodb://127.0.0.1:27017/sql_agent
      MONGO_DB_NAME: sql_agent
      MYSQL_HOST: localhost
      MYSQL_USER: root
      MYSQL_PASSWORD: root123
      MYSQL_DB_NAME: retail_sales_db
      OPENAI_API_KEY: dummy-openai-key-for-ci
      GOOGLE_APPLICATION_CREDENTIALS: ./google_key.json
      BIGQUERY_PROJECT_ID: test-project
      BIGQUERY_DATASET_ID: sales_data
      JWT_SECRET: test-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm install --legacy-peer-deps

      - name: Run Backend Tests
        working-directory: backend
        env:
          CI: true
        run: npm test -- --ci