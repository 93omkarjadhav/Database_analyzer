name: Node.js CI

# Trigger this workflow on every push or pull request to the main branch
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  frontend-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Pull your code from GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Step 3: Install frontend dependencies
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      # Step 4: Run frontend tests automatically
      - name: Run Frontend Tests
        env:
          CI: true
        run: |
          cd frontend
          npm test -- --watchAll=false

  backend-test:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      PORT: 5000
      MONGO_URI: ${{ secrets.MONGO_URI }}
      MONGO_DB_NAME: ${{ secrets.MONGO_DB_NAME || 'sql_agent' }}
      MYSQL_HOST: ${{ secrets.MYSQL_HOST || 'localhost' }}
      MYSQL_USER: ${{ secrets.MYSQL_USER || 'root' }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD || 'root123' }}
      MYSQL_DB_NAME: ${{ secrets.MYSQL_DB_NAME || 'retail_sales_db' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'dummy-openai-key-for-ci' }}
      GOOGLE_APPLICATION_CREDENTIALS: ./google_key.json
      BIGQUERY_PROJECT_ID: ${{ secrets.BIGQUERY_PROJECT_ID || 'retail-analytics-489405' }}
      BIGQUERY_DATASET_ID: ${{ secrets.BIGQUERY_DATASET_ID || 'sales_data' }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'mysupersecretkey' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm install --legacy-peer-deps

      - name: Run Backend Tests
        working-directory: backend
        env:
          CI: true
        run: npm test -- --ci